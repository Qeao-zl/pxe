<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="PXE Provisioning Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#334155" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#dots)"/>

  <rect x="0" y="0" width="6" height="260" fill="url(#accent)"/>

  <text x="64" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e2e8f0">PXE Provisioning Stack</text>
  <text x="66" y="146" font-family="Consolas, Menlo, monospace" font-size="19" fill="#93c5fd">DHCP &#183; TFTP &#183; HTTP &#8212; unattended Linux install on bare metal</text>

  <rect x="64" y="176" width="132" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#7dd3fc" opacity="0.9">
    <text x="64" y="216">Windows Server 2016 / 2019 / 2022</text>
    <text x="418" y="216" fill="#a5b4fc">&#183;  zero third-party runtime</text>
  </g>
</svg>
